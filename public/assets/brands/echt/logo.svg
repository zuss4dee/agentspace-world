<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!--
    The Echt Eye as the site icon. Same construction as components/EchtEye.tsx,
    trimmed to what survives at 32px: the pearl body, its rim, the iris, the
    pupil and one highlight. The four compass ticks and the bloom are dropped
    because at favicon size they turn into noise around the edge.
  -->
  <defs>
    <radialGradient id="b" cx="42%" cy="34%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="58%" stop-color="#f4f6f5"/>
      <stop offset="100%" stop-color="#cdd6d1"/>
    </radialGradient>
    <radialGradient id="i" cx="44%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#5fd98a"/>
      <stop offset="46%" stop-color="#22a94f"/>
      <stop offset="100%" stop-color="#0d6b2c"/>
    </radialGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="url(#b)"/>
  <circle cx="60" cy="60" r="56" fill="none" stroke="#0f1211" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="60" cy="60" r="36" fill="url(#i)"/>
  <circle cx="60" cy="60" r="36" fill="none" stroke="#0f1211" stroke-opacity="0.22" stroke-width="1.2"/>
  <circle cx="60" cy="60" r="20.5" fill="#0b0f0d"/>
  <ellipse cx="49.5" cy="47.5" rx="8.5" ry="7.4" fill="#ffffff"/>
</svg>
